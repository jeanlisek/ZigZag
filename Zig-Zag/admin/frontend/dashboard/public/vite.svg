<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Fond noir -->
  <rect width="200" height="200" fill="#000000"/>
  
  <!-- Personnage blob bleu -->
  <g id="character">
    <!-- Corps principal (blob) -->
    <path d="M 100 180 Q 60 180 50 150 Q 40 120 50 90 Q 60 60 80 50 Q 100 40 120 50 Q 140 60 150 90 Q 160 120 150 150 Q 140 180 100 180 Z" 
          fill="#87CEEB" 
          stroke="#000000" 
          stroke-width="3"/>
    
    <!-- Touffes blanches sur la tête -->
    <ellipse cx="70" cy="45" rx="8" ry="12" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
    <ellipse cx="90" cy="40" rx="6" ry="10" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
    <ellipse cx="110" cy="40" rx="6" ry="10" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
    <ellipse cx="130" cy="45" rx="8" ry="12" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
    
    <!-- Oreilles roses -->
    <ellipse cx="55" cy="70" rx="8" ry="12" fill="#FFB6C1" stroke="#000000" stroke-width="2"/>
    <ellipse cx="145" cy="70" rx="8" ry="12" fill="#FFB6C1" stroke="#000000" stroke-width="2"/>
    
    <!-- Joues roses -->
    <circle cx="75" cy="100" r="12" fill="#FFB6C1"/>
    <circle cx="125" cy="100" r="12" fill="#FFB6C1"/>
    
    <!-- Yeux fermés (arcs joyeux) -->
    <path d="M 80 95 Q 85 90 90 95" 
          stroke="#000000" 
          stroke-width="3" 
          fill="none" 
          stroke-linecap="round"/>
    <path d="M 110 95 Q 115 90 120 95" 
          stroke="#000000" 
          stroke-width="3" 
          fill="none" 
          stroke-linecap="round"/>
    
    <!-- Sourire -->
    <path d="M 85 115 Q 100 125 115 115" 
          stroke="#000000" 
          stroke-width="3" 
          fill="none" 
          stroke-linecap="round"/>
    
    <!-- Mains tenant le dessin -->
    <ellipse cx="60" cy="140" rx="6" ry="8" fill="#87CEEB" stroke="#000000" stroke-width="2"/>
    <ellipse cx="140" cy="140" rx="6" ry="8" fill="#87CEEB" stroke="#000000" stroke-width="2"/>
    
    <!-- Dessin (papier blanc) -->
    <rect x="70" y="120" width="60" height="45" 
          fill="#FFFFFF" 
          stroke="#000000" 
          stroke-width="2" 
          rx="2"/>
    
    <!-- Contenu du dessin -->
    <!-- Soleil -->
    <circle cx="95" cy="135" r="6" fill="#FFD700" stroke="#000000" stroke-width="1"/>
    <line x1="95" y1="135" x2="95" y2="128" stroke="#000000" stroke-width="1"/>
    <line x1="95" y1="135" x2="95" y2="142" stroke="#000000" stroke-width="1"/>
    <line x1="95" y1="135" x2="88" y2="135" stroke="#000000" stroke-width="1"/>
    <line x1="95" y1="135" x2="102" y2="135" stroke="#000000" stroke-width="1"/>
    
    <!-- Nuages -->
    <ellipse cx="110" cy="132" rx="4" ry="3" fill="#E0F2FF" stroke="#000000" stroke-width="1"/>
    <ellipse cx="115" cy="132" rx="4" ry="3" fill="#E0F2FF" stroke="#000000" stroke-width="1"/>
    <ellipse cx="112" cy="130" rx="4" ry="3" fill="#E0F2FF" stroke="#000000" stroke-width="1"/>
    
    <!-- Oiseaux -->
    <path d="M 85 130 Q 88 128 91 130" stroke="#000000" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <path d="M 88 128 Q 90 126 92 128" stroke="#000000" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    
    <!-- Montagnes -->
    <path d="M 75 155 L 85 145 L 95 155 Z" fill="#FFA500" stroke="#000000" stroke-width="1"/>
    <path d="M 85 155 L 100 140 L 115 155 Z" fill="#FFA500" stroke="#000000" stroke-width="1"/>
    <path d="M 105 155 L 115 145 L 125 155 Z" fill="#FFA500" stroke="#000000" stroke-width="1"/>
    
    <!-- Sol orange -->
    <rect x="75" y="155" width="50" height="8" fill="#FFA500" stroke="#000000" stroke-width="1"/>
  </g>
</svg>

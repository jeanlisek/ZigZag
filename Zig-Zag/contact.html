    <script>
        // --- TRAINEE DE PINCEAU (DRAWING TRAIL) ---
        const canvas = document.getElementById('drawing-canvas');
        const ctx = canvas.getContext('2d');
        let points = [];
        let width, height;

        // Redimensionner le canvas
        const resize = () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        };
        window.addEventListener('resize', resize);
        resize();

        // Ajouter des points lors du mouvement de la souris
        window.addEventListener('mousemove', (e) => {
            points.push({
                x: e.clientX,
                y: e.clientY,
                age: 0,
                color: Math.random() > 0.5 ? '#f54291' : '#ff912d' // Rose ou Orange
            });
        });

        // Boucle d'animation
        const animate = () => {
            ctx.clearRect(0, 0, width, height);
            
            // Dessiner la ligne
            if (points.length > 1) {
                ctx.beginPath();
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';

                for (let i = 0; i < points.length - 1; i++) {
                    const p1 = points[i];
                    const p2 = points[i+1];
                    
                    ctx.beginPath();
                    ctx.moveTo(p1.x, p1.y);
                    ctx.lineTo(p2.x, p2.y);
                    
                    // L'opacité diminue avec l'âge du point
                    const opacity = 1 - (p1.age / 50);
                    ctx.strokeStyle = p1.color + Math.floor(opacity * 255).toString(16).padStart(2, '0');
                    ctx.lineWidth = (1 - (p1.age / 50)) * 8; // La ligne s'affine
                    
                    if (opacity > 0) ctx.stroke();
                }
            }

            // Mettre à jour l'âge des points et supprimer les vieux
            points = points.filter(p => {
                p.age++;
                return p.age < 50; // Durée de vie de la traînée
            });

            requestAnimationFrame(animate);
        };
        animate();
    </script>

    <script>
        const SUPABASE_URL = "https://tihrltssmpxpreadpzqm.supabase.co";

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const contactForm = document.getElementById("contact-form");
        const contactFirstname = document.getElementById("contact-firstname");
        const contactLastname = document.getElementById("contact-lastname");
        const contactEmail = document.getElementById("contact-email");
        const contactMessage = document.getElementById("contact-message");
        const contactFeedback = document.getElementById("contact-feedback");

        if (contactForm && contactFirstname && contactLastname && contactEmail && contactMessage && contactFeedback) {
            contactForm.addEventListener("submit", async (event) => {
                event.preventDefault();

                const first = contactFirstname.value.trim();
                const last = contactLastname.value.trim();
                const email = contactEmail.value.trim();
                const message = contactMessage.value.trim();

                if (!first || !last || !email || !message) {
                    contactFeedback.textContent = "Merci de compléter tous les champs.";
                    contactFeedback.className = "mt-6 text-sm text-red-300";
                    return;
                }

                contactFeedback.textContent = "Envoi en cours...";
                contactFeedback.className = "mt-6 text-sm text-gray-300";

                function showToast(message) {
                    let container = document.querySelector(".toast-container");
                    if (!container) {
                        container = document.createElement("div");
                        container.className = "toast-container fixed top-24 right-6 z-50";
                        document.body.appendChild(container);
                    }

                    const toast = document.createElement("div");
                    toast.className = "toast bg-white/90 text-gray-900 px-6 py-4 rounded-2xl shadow-xl flex items-center gap-3 min-w-[300px]";
                    toast.innerHTML = `
                        <div class="w-2 h-2 rounded-full bg-green-500"></div>
                        <div>
                            <strong class="font-bold">Message envoyé</strong><br>
                            <span class="text-sm">${message}</span>
                        </div>
                    `;
                    container.appendChild(toast);

                    setTimeout(() => {
                        toast.style.opacity = "0";
                        toast.style.transform = "translateX(100%)";
                        toast.style.transition = "all 0.3s ease";
                        setTimeout(() => {
                            toast.remove();
                            if (!container.hasChildNodes()) {
                                container.remove();
                            }
                        }, 300);
                    }, 3600);
                }

                try {
                    const { error } = await supabaseClient
                        .from("contact_messages")
                        .insert({
                            first_name: first,
                            last_name: last,
                            email,
                            message
                        });

                    if (error) {
                        console.error(error);
                        contactFeedback.textContent = "Une erreur est survenue. Merci de réessayer.";
                        contactFeedback.className = "mt-6 text-sm text-red-300";
                        return;
                    }

                    contactForm.reset();
                    contactFeedback.textContent = "";
                    showToast("Merci ! Votre message a bien été envoyé.");
                } catch (err) {
                    console.error(err);
                    contactFeedback.textContent = "Une erreur inattendue est survenue.";
                    contactFeedback.className = "mt-6 text-sm text-red-300";
                }
            });
        }
